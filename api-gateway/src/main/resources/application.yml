  server:
    port: 8080

  spring:
    application:
      name: api-gateway
    cloud:
      gateway:
        server:
          webflux:
            routes:
              - id: auth-rest
                uri: http://localhost:8081
                predicates:
                  - Path=/auth/**

              # CLIENTES - REST
              - id: clientes-rest
                uri: http://localhost:8082
                predicates:
                  - Path=/clientes/**

              # CLIENTES - SOAP
              - id: clientes-soap
                uri: http://localhost:8082
                predicates:
                  - Path=/soap/clientes/**
                filters:
                  - RewritePath=/soap/clientes/?(?<rest>.*), /services/clientes/${rest}

              # COTIZACIONES - REST
              - id: cotizaciones-rest
                uri: http://localhost:8083
                predicates:
                  - Path=/cotizaciones/**

              # COTIZACIONES - SOAP
              - id: cotizaciones-soap
                uri: http://localhost:8083
                predicates:
                  - Path=/soap/cotizaciones/**
                filters:
                  - RewritePath=/soap/cotizaciones/?(?<rest>.*), /services/cotizaciones/${rest}

              # LLAMADAS - REST
              - id: llamadas-rest
                uri: http://localhost:8084
                predicates:
                  - Path=/llamadas/**

              # LLAMADAS - SOAP
              - id: llamadas-soap
                uri: http://localhost:8084
                predicates:
                  - Path=/soap/llamadas/**
                filters:
                  - RewritePath=/soap/llamadas/?(?<rest>.*), /services/llamadas/${rest}

            globalcors:
              add-to-simple-url-handler-mapping: true
              cors-configurations:
                '[/**]':
                  allowedOrigins:
                    - "http://localhost:4200"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - PATCH
                    - OPTIONS
                  allowedHeaders:
                    - Authorization
                    - Content-Type
                    - X-User-Id
                    - SOAPAction
                    - Accept
                    - Origin
                  allowCredentials: true
                  maxAge: 3600

  jwt:
    secret: 6f2c9a1d8b7e4c3f9a0d1e2c3b4a5f6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/

  management:
    endpoints:
      web:
        exposure:
          include: gateway,health,info
    endpoint:
      gateway:
        enabled: true

  logging:
    level:
      org.springframework.cloud.gateway: INFO
      org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO