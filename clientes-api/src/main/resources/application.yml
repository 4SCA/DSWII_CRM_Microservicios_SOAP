server:
  port: 8082

spring:
  application:
    name: clientes-api

  datasource:
    url: jdbc:mysql://localhost:3307/clientes_db
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-discovery-server:8761/eureka/