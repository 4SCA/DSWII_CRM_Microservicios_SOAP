server:
  port: 8084

spring:
  application:
    name: llamada-api

  datasource:
    url: jdbc:mysql://localhost:3308/llamada_db
    username: user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

cxf:
  path: /services